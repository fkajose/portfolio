<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Farook Ajose</title>
    {% block styles %} {{ bootstrap.load_css() }}
    <link
      href="https://fonts.googleapis.com/css?family=Space+Grotesk:400,700,400italic,700italic"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet"
    />
    {% endblock %}
  </head>
  <body class="admin-body">
    <div class="admin-wrapper">
      <div id="adminLogin" class="admin-card">
        <div class="admin-card-icon">
          <i class="fas fa-lock"></i>
        </div>
        <h1 class="admin-title">Admin sign in</h1>

        <div id="loginError" class="admin-error d-none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <input
              type="email"
              id="loginEmail"
              class="form-control admin-input"
              placeholder="Email"
              required
              autocomplete="username"
            />
          </div>
          <div class="mb-3">
            <input
              type="password"
              id="loginPassword"
              class="form-control admin-input"
              placeholder="Password"
              required
              autocomplete="current-password"
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary w-100 text-uppercase"
            id="loginButton"
          >
            Sign in
          </button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (function () {
        const supabaseClient = supabase.createClient(
          "{{ config.SUPABASE_URL }}",
          "{{ config.SUPABASE_ANON_KEY }}",
        );

        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");
        const loginButton = document.getElementById("loginButton");

        function showError(message) {
          loginError.textContent = message;
          loginError.classList.remove("d-none");
        }

        function clearError() {
          loginError.classList.add("d-none");
          loginError.textContent = "";
        }

        async function redirectIfSignedIn() {
          const { data } = await supabaseClient.auth.getSession();
          if (data.session) {
            window.location.href = "{{ url_for('admin_projects') }}";
          }
        }

        loginForm.addEventListener("submit", async function (e) {
          e.preventDefault();
          clearError();

          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;

          if (!email || !password) {
            showError("Enter your email and password.");
            return;
          }

          loginButton.disabled = true;
          loginButton.textContent = "Signing in…";

          const { error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password,
          });

          loginButton.disabled = false;
          loginButton.textContent = "Sign in";

          if (error) {
            showError("Couldn't sign in. Check your email and password.");
            return;
          }

          window.location.href = "{{ url_for('admin_projects') }}";
        });

        redirectIfSignedIn();
      })();
    </script>
  </body>
</html>
